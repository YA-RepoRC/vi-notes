<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f3a5f">
<title>VI Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--line2:#e5e7eb;
  --brand:#1f3a5f;--brand2:#2f5d8f;--accent:#0e7c86;--chip:#eef2f7;--chipon:#1f3a5f;--warn:#b45309;--danger:#b91c1c;--ok:#15803d;
  --r:10px;--tap:46px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand2)}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:env(safe-area-inset-top) 12px 0 12px;min-height:calc(56px + env(safe-area-inset-top))}
#top .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:17px}
#top .sub{font-size:12px;opacity:.8;font-weight:400}
.tb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;height:38px;padding:0 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tb:active{background:rgba(255,255,255,.3)}
.tb.icon{width:38px;padding:0;font-size:20px}

/* ---------- layout ---------- */
#app{display:flex;min-height:calc(100vh - 56px)}
#side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line2);position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#main{flex:1;min-width:0;padding:18px 22px 120px}
.wrap{max-width:960px;margin:0 auto}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line2);display:flex;overflow-x:auto;padding:6px}
  #side .sec{flex:none;width:auto;border:1px solid var(--line2);border-radius:20px;padding:6px 12px;margin:2px}
  #side .sec .nm{gap:8px}
  #side .sec .bar,#side .secs-hd{display:none}
  #main{padding:12px 12px 120px}
}

/* ---------- sidebar ---------- */
.secs-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.secs-hd button{border:0;background:none;color:var(--brand2);font-size:13px;font-weight:600;padding:4px}
.sec{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-left:3px solid transparent}
.sec.on{background:#eef2f7;border-left-color:var(--brand)}
.sec .nm{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.sec .cnt{font-size:11px;color:var(--muted);background:var(--chip);padding:1px 6px;border-radius:8px}
.sec .bar{height:3px;background:var(--line2);border-radius:2px;margin-top:6px;overflow:hidden}
.sec .bar i{display:block;height:100%;background:var(--accent);width:0}
.sec.off{opacity:.45}

/* ---------- inspection list ---------- */
.list-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);height:var(--tap);padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--danger);border-color:#fca5a5}
.btn:active{filter:brightness(.92)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.card .info{flex:1;min-width:0}
.card .t{font-weight:600;font-size:17px}
.card .m{color:var(--muted);font-size:14px;margin-top:2px}
.card .prog{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:16px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:8px}

/* ---------- section form ---------- */
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-title h2{font-size:24px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.f{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;min-width:0}
.f.full{grid-column:1/-1}
.f.na .body{opacity:.35;pointer-events:none}
.f .lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.f .lbl span{min-width:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400;text-transform:none;letter-spacing:0}
.hd{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:8px 2px 4px;border-bottom:2px solid var(--brand)}
.hd:first-child{margin-top:0}
.hd h3{font-size:18px;color:var(--brand);font-weight:700}
.hd .r{display:flex;align-items:center;gap:8px}
.na-tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;border:1px solid var(--line);border-radius:20px;padding:0 12px;height:34px;background:var(--panel)}
.na-tog.on{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.in{width:100%;height:var(--tap);border:1px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;font-size:17px}
.in:focus,textarea.in:focus{outline:2px solid var(--brand2);outline-offset:-1px}
textarea.in{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:22px;height:40px;padding:0 14px;font-size:15px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--chipon);border-color:var(--chipon);color:#fff}
.status .chips{margin-bottom:8px}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lr label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.tread{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tread label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.tread .u{display:flex;align-items:center;gap:6px}
.tread .u span{color:var(--muted);font-weight:600}
.vinrow{display:flex;gap:8px}
.vinrow .in{text-transform:uppercase;letter-spacing:.06em;font-family:ui-monospace,Menlo,Consolas,monospace}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:0 6px 6px}
table.tbl td{padding:3px}
table.tbl .in{height:40px;font-size:15px;padding:0 8px}
table.tbl .del{width:36px;height:40px;border:0;background:none;color:var(--muted);font-size:18px}
.addrow{margin-top:8px}
@media (max-width:760px){table.tbl{display:block;overflow-x:auto}}

/* camera */
.cam{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:20px;height:34px;padding:0 10px 0 8px;font-size:14px;font-weight:600;color:var(--brand2);white-space:nowrap;flex:none}
.cam svg{width:18px;height:18px}
.cam.has{background:#e0f2f4;border-color:#99d6db;color:#0e5a62}
.cam .n{background:var(--accent);color:#fff;border-radius:10px;padding:0 6px;font-size:12px;min-width:18px;text-align:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line2)}
.thumbs .th{position:relative}
.thumbs .th b{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 5px;border-radius:5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.modal{align-items:center}}
.modal .box{background:var(--panel);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 18px 30px}
@media (min-width:761px){.modal .box{border-radius:16px}}
.modal h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.pv{display:flex;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.pv img{width:140px;height:140px;object-fit:cover;border-radius:8px;flex:none}
.pv .pi{flex:1;min-width:0}
.pv .pn{font-weight:700;color:var(--brand)}
.pv .pi .in{margin-top:6px}
.pv .acts{display:flex;gap:8px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.secpick label{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);font-size:16px}
.secpick input{width:22px;height:22px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line2);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;z-index:15}
@media (min-width:761px){.bottombar{left:250px}}
.meta-strip{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:14px}
.meta-strip b{color:var(--ink)}

/* ---------- report ---------- */
#report{background:#fff;color:#000;padding:0}
.rp{max-width:8.5in;margin:0 auto;padding:.5in .6in;font:11pt/1.35 Georgia,"Times New Roman",serif}
.rp-tools{position:sticky;top:0;background:var(--brand);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
.rp-tools label{display:flex;align-items:center;gap:6px;font-size:14px}
.rp h1{font:700 20pt/1.2 Helvetica,Arial,sans-serif;color:var(--brand);letter-spacing:.02em}
.rp .cover{border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:16px}
.rp .cover .k{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 12px;margin-top:10px;font-size:10.5pt}
.rp .cover .k b{color:#374151;font-family:Helvetica,Arial,sans-serif;font-size:9.5pt;text-transform:uppercase;letter-spacing:.04em}
.rp h2{font:700 14pt/1.2 Helvetica,Arial,sans-serif;color:#fff;background:var(--brand);padding:5px 10px;margin:22px 0 10px;break-after:avoid;page-break-after:avoid}
.rp h3{font:700 11pt/1.2 Helvetica,Arial,sans-serif;color:var(--brand);border-bottom:1.5px solid var(--brand);padding-bottom:3px;margin:14px 0 6px;break-after:avoid}
.rp h3 .na{font-weight:400;color:#92400e;font-size:9.5pt;margin-left:8px}
.rp .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.rp .kv .it{display:grid;grid-template-columns:44% 56%;gap:6px;padding:3px 0;border-bottom:1px dotted #d1d5db;break-inside:avoid}
.rp .kv .it.full{grid-column:1/-1}
.rp .kv .k{font:600 9pt/1.3 Helvetica,Arial,sans-serif;color:#374151}
.rp .kv .v{white-space:pre-wrap;min-height:1em}
.rp .kv .v.blank{border-bottom:1px solid #000;min-height:1.6em}
.rp .kv .v.blank.tall{min-height:4.5em;background:repeating-linear-gradient(to bottom,transparent 0,transparent 1.45em,#d1d5db 1.45em,#d1d5db calc(1.45em + 1px))}
.rp .v .lrv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp .v .lrv small{display:block;color:#6b7280;font-size:8pt;font-family:Helvetica,Arial,sans-serif}
.rp table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4px 0}
.rp th,.rp td{border:1px solid #9ca3af;padding:3px 6px;text-align:left;vertical-align:top}
.rp th{background:#eef2f7;font-family:Helvetica,Arial,sans-serif;font-size:8.5pt}
.rp .blankrows td{height:20px}
.rp .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.rp .ph{break-inside:avoid;font-size:8.5pt;font-family:Helvetica,Arial,sans-serif}
.rp .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid #9ca3af;display:block}
.rp .ph b{color:var(--brand)}
.rp .log td:first-child{white-space:nowrap;font-weight:700;color:var(--brand)}
.rp .foot{margin-top:30px;font-size:8.5pt;color:#6b7280;font-family:Helvetica,Arial,sans-serif;border-top:1px solid #d1d5db;padding-top:6px}
.rp .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.rp .sig div{border-top:1px solid #000;padding-top:4px;font-size:9pt;font-family:Helvetica,Arial,sans-serif}
@media print{
  @page{size:letter;margin:.5in}
  body{background:#fff}
  #top,.rp-tools,.bottombar{display:none!important}
  .rp{padding:0;max-width:none}
  .rp h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp.blankform h2{break-before:page;page-break-before:always}
  .rp h2.first{break-before:auto;page-break-before:auto}
  .rp th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="top">
  <button class="tb icon" id="btnBack" title="Back">‹</button>
  <div class="ttl"><div id="ttl">VI Notes</div><div class="sub" id="sub"></div></div>
  <div id="topActs" class="row"></div>
</div>
<div id="app">
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="report" class="hidden"></div>
<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden" multiple>
<input type="file" id="libInput" accept="image/*" class="hidden" multiple>
<input type="file" id="impInput" accept=".zip,.json" class="hidden">
<script>
/* ===== Inspection schema =====
 * Field types: text, num, date, area, select, multi, yn, status, lr, tread, table, heading
 * Every field/heading can take photos. Edit freely — the app renders from this.
 */
const STATUS_OPTS = ['Unremarkable', 'Comment', 'Not Evaluated'];
const INTACT = ['Intact', 'Broken Out', 'N/A'];

function tireBlock(p, label, spare) {
  const f = [
    { id: p + '_hdr', type: 'heading', label },
    { id: p + '_brand', label: 'Brand', type: 'text' },
    { id: p + '_model', label: 'Model', type: 'text' },
    { id: p + '_size', label: 'Size', type: 'text' },
    { id: p + '_dot', label: 'DOT', type: 'text' },
    { id: p + '_psi', label: 'Pressure (PSI)', type: 'num' },
    { id: p + '_unseated', label: 'Unseated', type: 'yn' },
    { id: p + '_tread', label: 'Tread Depth (/32")', type: 'tread', full: true },
    { id: p + '_wsize', label: 'Wheel Size', type: 'text' },
    { id: p + '_wmat', label: 'Wheel Material', type: 'select', opts: ['Steel', 'Aluminum', 'Other'] },
    { id: p + '_oe', label: 'O.E. Type', type: 'yn' },
    { id: p + '_valve', label: 'Valve Stem Position', type: 'text', hint: 'clock position / relative to damage' },
  ];
  if (spare) f.push(
    { id: p + '_loc', label: 'Location', type: 'text' },
    { id: p + '_kind', label: 'Spare Type', type: 'select', opts: ['Full Size', 'Compact', 'None / Inflator Kit'] }
  );
  f.push({ id: p + '_notes', label: 'Notes', type: 'area', full: true });
  return f;
}

function beltBlock(p, label, opts = {}) {
  const f = [
    { id: p + '_hdr', type: 'heading', label, na: true },
    { id: p + '_type', label: 'Type', type: 'multi', opts: ['2 Point', '3 Point', 'Manual', 'Automatic'] },
    { id: p + '_retr', label: 'Retractor', type: 'multi', opts: ['ELR', 'ALR', 'Webbing Sensitive', 'Vehicle Sensitive', 'Switchable'] },
    { id: p + '_latch', label: 'Latch Plate', type: 'text' },
    { id: p + '_buckle', label: 'Latch Plate / Buckle Function', type: 'select', opts: ['Functional', 'Not Functional', 'Not Evaluated'] },
  ];
  if (!opts.center) f.push({ id: p + '_dring', label: 'D-Ring', type: 'select', opts: ['Adjustable', 'Fixed'] });
  f.push({ id: p + '_web', label: 'Webbing', type: 'multi', opts: ['Intact', 'Found in Stowed Position', 'Intentionally Cut', 'Load Marks', 'Transfer Marks', 'Fraying / Damage'], full: true });
  if (opts.pt) f.push(
    { id: p + '_ptloc', label: 'Pre-Tensioner Location', type: 'multi', opts: ['Retractor', 'Buckle', 'Anchor', 'None'] },
    { id: p + '_ptfired', label: 'Pre-Tensioner Fired', type: 'select', opts: ['Yes', 'No', 'Not Evaluated'] }
  );
  f.push({ id: p + '_notes', label: 'Notes', type: 'area', full: true });
  return f;
}

function airbagBlock(p, label) {
  return [
    { id: p + '_hdr', type: 'heading', label, na: true },
    { id: p + '_eq', label: 'Equipped', type: 'yn' },
    { id: p + '_dep', label: 'Deployed', type: 'yn' },
    { id: p + '_dia', label: 'Diameter / Size', type: 'text' },
    { id: p + '_vent', label: 'Vent Size', type: 'text' },
    { id: p + '_ventloc', label: 'Vent Locations', type: 'text' },
    { id: p + '_mat', label: 'Material', type: 'text' },
    { id: p + '_tether', label: 'Tethers', type: 'select', opts: ['Intact', 'Torn', 'None', 'Not Evaluated'] },
    { id: p + '_contact', label: 'Occupant Contact Evidence', type: 'multi', opts: ['None Observed', 'Makeup / Skin Transfer', 'Blood', 'Hair', 'Abrasion Marks', 'Other'], full: true },
    { id: p + '_notes', label: 'Comments', type: 'area', full: true },
  ];
}

function suspBlock(items) {
  return items.map(i => ({ id: i[0], label: i[1], type: i[2] || 'lr', opts: i[3], full: true }));
}

const SCHEMA = [
  {
    id: 'case', title: 'Case & Inspection', short: 'Case', always: true, fields: [
      { id: 'case', label: 'Case / Matter', type: 'text', full: true },
      { id: 'client', label: 'Client / Retaining Counsel', type: 'text' },
      { id: 'fileno', label: 'File No.', type: 'text' },
      { id: 'vi_date', label: 'VI Date', type: 'date' },
      { id: 'vi_loc', label: 'VI Location', type: 'text' },
      { id: 'vi_eng', label: 'VI Engineers', type: 'text', full: true },
      { id: 'attend', label: 'Other Attendees / Parties Present', type: 'area', full: true },
      { id: 'weather', label: 'Conditions (weather / lighting / indoors)', type: 'text', full: true },
    ]
  },
  {
    id: 'vehicle', title: 'Vehicle Information', short: 'Vehicle', fields: [
      { id: 'vin', label: 'VIN', type: 'vin', full: true },
      { id: 'year', label: 'Model Year', type: 'text' },
      { id: 'make', label: 'Make', type: 'text' },
      { id: 'model', label: 'Model', type: 'text' },
      { id: 'trim', label: 'Trim / Additional Model Codes', type: 'text' },
      { id: 'build', label: 'Build Date', type: 'text' },
      { id: 'body', label: 'Body Style', type: 'text' },
      { id: 'engine', label: 'Engine', type: 'text' },
      { id: 'trans', label: 'Transmission', type: 'select', opts: ['Automatic', 'Standard', 'CVT', 'EV Single-Speed'] },
      { id: 'drive', label: 'Drive Type', type: 'select', opts: ['FWD', 'RWD', '4WD', 'AWD'] },
      { id: 'doors', label: 'Door Configuration', type: 'text' },
      { id: 'gvwr', label: 'GVWR (lbs)', type: 'num' },
      { id: 'fgawr', label: 'FGAWR (lbs)', type: 'num' },
      { id: 'rgawr', label: 'RGAWR (lbs)', type: 'num' },
      { id: 'mileage', label: 'Mileage (odometer)', type: 'num' },
      { id: 'certtire', label: 'Tire Size & Pressure per Cert Sticker', type: 'text', full: true },
      { id: 'license', label: 'License Plate / State', type: 'text' },
      { id: 'insp_sticker', label: 'Inspection Sticker Date', type: 'text' },
      { id: 'reg', label: 'Registration Date', type: 'text' },
      { id: 'color', label: 'Exterior Color', type: 'text' },
      { id: 'opt', label: 'Optional Equipment', type: 'multi', full: true, opts: ['Side Airbags', 'Curtain Airbags', 'Knee Airbags', 'ABS', 'TCS', 'ESC', 'Power Steering', 'Tilt Steering', 'Power Brakes', 'Speed Control', 'Adaptive Cruise', 'Sunroof', 'Tow Package'] },

function updateSideCount(sec) { const p = sectionProgress(S.insp, sec); const b = $(`#side [data-sec="${sec.id}"]`); if (b) { b.querySelector('.cnt').textContent = `${p.done}/${p.tot}`; b.querySelector('.bar i').style.width = (p.tot ? p.done / p.tot * 100 : 0) + '%'; } if (sec.id === 'case' || sec.id === 'vehicle') $('#ttl').textContent = inspTitle(S.insp); }

async function decodeVin(d) {
  const vin = (d.vin || '').trim().toUpperCase(); if (vin.length !== 17) return toast('VIN must be 17 characters');
  if (!navigator.onLine) return toast('VIN decode needs a connection');
  toast('Decoding…');
  try {
    const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`); const j = await r.json(); const x = j.Results[0];
    const set = (k, v) => { if (v && !d[k]) d[k] = v; };
    set('year', x.ModelYear); set('make', titleCase(x.Make)); set('model', x.Model); set('trim', [x.Trim, x.Series].filter(Boolean).join(' / ')); set('body', x.BodyClass); set('doors', x.Doors ? x.Doors + ' door' : '');
    set('engine', [x.DisplacementL ? x.DisplacementL + 'L' : '', x.EngineCylinders ? x.EngineCylinders + ' cyl' : '', x.FuelTypePrimary, x.ElectrificationLevel].filter(Boolean).join(' '));
    if (x.DriveType && !d.drive) { const m = { 'FWD': 'FWD', 'RWD': 'RWD', '4WD': '4WD', 'AWD': 'AWD' }; for (const k in m) if (x.DriveType.toUpperCase().includes(k)) d.drive = m[k]; }
    if (x.TransmissionStyle && !d.trans) d.trans = /auto|cvt/i.test(x.TransmissionStyle) ? (/cvt/i.test(x.TransmissionStyle) ? 'CVT' : 'Automatic') : 'Standard';
    if (x.GVWR && !d.gvwr) { const m = x.GVWR.match(/\(([\d,]+)\s*lb/); if (m) d.gvwr = m[1].replace(/,/g, ''); }
    d.vin = vin; save(); renderSection(); renderSide(); toast(x.ErrorCode === '0' ? 'Decoded' : 'Decoded with warnings — verify');
  } catch (e) { toast('Decode failed'); }
}
const titleCase = s => (s || '').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

  modal(`<h3>Add photo <button class="btn sm" data-close>Cancel</button></h3><div class="row"><button class="btn primary" id="pCam">${CAM_SVG} Take Photo</button><button class="btn" id="pLib">Choose from Library</button></div>`, (box, close) => {

$('#camInput').onchange = $('#libInput').onchange = async e => { const files = [...e.target.files]; e.target.value = ''; if (!files.length || !camTarget) return; for (const f of files) await addPhoto(f, camTarget.sid, camTarget.fid); renderSection(); renderSide(); toast(files.length + ' photo' + (files.length > 1 ? 's' : '') + ' added'); };

function loadImg(blob) { return new Promise((res, rej) => { const u = URL.createObjectURL(blob); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = rej; im.src = u; }); }

async function addPhoto(file, sid, fid) {
  const im = await loadImg(file);
  const thumb = scale(im, 320, .7); const rep = await scale(im, 1600, .82, true);
  S.insp.photoSeq = (S.insp.photoSeq || 0) + 1;
  const repBuf = await blobToBuf(rep); let origBuf = await blobToBuf(file); if (!origBuf || !origBuf.byteLength) origBuf = repBuf;
  const p = { id: uid(), inspId: S.insp.id, sec: sid, field: fid, num: S.insp.photoSeq, ts: new Date().toISOString(), caption: '', thumb, repBuf, origBuf, origType: file.type || 'image/jpeg', origName: file.name || '' };
  await DB.put('photos', p); p.rep = rep; p.orig = new Blob([origBuf], { type: p.origType }); S.photos.push(p); await saveNow();
}
function photoLabel(p) { const s = secById(p.sec); const f = s && fieldOf(s, p.field); return (s ? s.title : p.sec) + (f ? ' › ' + f.label : ''); }
function photoModal(id) {

  const url = URL.createObjectURL(p.rep);
  modal(`<h3>Photo ${p.num} <button class="btn sm" data-close>Done</button></h3><div class="pv"><img src="${url}" onerror="this.onerror=null;this.src=this.dataset.t" data-t="${p.thumb}" style="width:100%;height:auto;max-height:50vh;object-fit:contain"></div><div class="pi"><div class="pn">${esc(photoLabel(p))}</div><div class="hint">${new Date(p.ts).toLocaleString()}</div><input class="in" id="pCap" value="${esc(p.caption)}" placeholder="Caption"><div class="acts"><button class="btn sm" id="pMove">Move to…</button><button class="btn sm danger" id="pDel">Delete</button></div></div>`, (box, close) => {
    box.querySelector('#pCap').oninput = e => { p.caption = e.target.value; DB.put('photos', toRecord(p)); };
    box.querySelector('#pDel').onclick = async () => { if (!confirm('Delete photo ' + p.num + '?')) return; await DB.del('photos', p.id); S.photos = S.photos.filter(x => x.id !== p.id); close(); renderSection(); renderSide(); };
    box.querySelector('#pMove').onclick = () => { close(); movePhoto(p); };

}
function movePhoto(p) {
  const opts = []; for (const sid of S.insp.enabled) { const s = secById(sid); for (const f of s.fields) opts.push(`<option value="${sid}|${f.id}" ${p.sec === sid && p.field === f.id ? 'selected' : ''}>${esc(s.short)} › ${esc(f.label)}</option>`); }
  modal(`<h3>Move photo ${p.num} <button class="btn sm" data-close>Cancel</button></h3><select class="in" id="mvSel">${opts.join('')}</select><div class="row" style="margin-top:12px"><button class="btn primary" id="mvOk">Move</button></div>`, (box, close) => {
    box.querySelector('#mvOk').onclick = async () => { const [sid, fid] = box.querySelector('#mvSel').value.split('|'); p.sec = sid; p.field = fid; await DB.put('photos', toRecord(p)); close(); renderSection(); renderSide(); };

}
function renderPhotoLog() {
  const ps = S.photos.slice().sort((a, b) => a.num - b.num);
  let h = `<div class="wrap"><div class="sec-title"><h2>Photo Log</h2><span class="hint">${ps.length} photos</span></div>`;
  if (!ps.length) h += '<div class="empty"><b>No photos yet</b>Use the camera button on any field or section heading.</div>';
  for (const p of ps) h += `<div class="card" data-ph="${p.id}"><img src="${p.thumb}" style="width:84px;height:84px;object-fit:cover;border-radius:8px"><div class="info"><div class="t">Photo ${p.num}${p.caption ? ' — ' + esc(p.caption) : ''}</div><div class="m">${esc(photoLabel(p))}</div><div class="m">${new Date(p.ts).toLocaleString()}</div></div></div>`;

/* ===================== report ===================== */
function valHtml(f, v, blank) {
  if (blank) { if (f.type === 'table') return tableHtml(f, [], true); return `<div class="v blank ${f.type === 'area' ? 'tall' : ''}">${['select', 'yn', 'multi', 'status', 'lrsel'].includes(f.type) ? esc((f.opts || ['Yes', 'No']).join('  /  ')) : ''}</div>`; }
  if (!isFilled(v)) return '';
  switch (f.type) {
    case 'multi': return `<div class="v">${esc(v.join(', '))}</div>`;
    case 'status': return `<div class="v">${esc([v.s, v.c].filter(Boolean).join(' — '))}</div>`;
    case 'lr': { const c = f.cols || ['Left', 'Right']; return `<div class="v"><div class="lrv"><div><small>${esc(c[0])}</small>${esc(v.l)}</div><div><small>${esc(c[1])}</small>${esc(v.r)}</div></div></div>`; }
    case 'lrsel': return `<div class="v"><div class="lrv"><div><small>Left</small>${esc([v.l, v.lc].filter(Boolean).join(' — '))}</div><div><small>Right</small>${esc([v.r, v.rc].filter(Boolean).join(' — '))}</div></div></div>`;
    case 'tread': return `<div class="v">Outside ${esc(v.o || '—')}/32 · Middle ${esc(v.m || '—')}/32 · Inside ${esc(v.i || '—')}/32</div>`;
    case 'table': return tableHtml(f, v);
    case 'date': return `<div class="v">${esc(fmtDate(v))}</div>`;
    default: return `<div class="v">${esc(v)}</div>`;
  }
}
function tableHtml(f, rows, blank) {
  const body = blank ? Array.from({ length: 8 }, () => `<tr class="blankrows">${f.columns.map(() => '<td></td>').join('')}</tr>`).join('') : rows.filter(r => isFilled(r)).map(r => `<tr>${f.columns.map(c => `<td>${esc(r[c.id])}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${f.columns.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}
function photosHtml(ps, urls) { if (!ps.length) return ''; return `<div class="photos">${ps.map(p => `<div class="ph"><img src="${urls[p.id]}" onerror="this.onerror=null;this.src=this.dataset.t" data-t="${p.thumb}"><b>Photo ${p.num}</b>${p.caption ? ' — ' + esc(p.caption) : ''}</div>`).join('')}</div>`; }

function renderReport() {
  const i = S.insp; $('#app').classList.add('hidden'); const R = $('#report'); R.classList.remove('hidden');
  $('#btnBack').classList.remove('hidden'); $('#btnBack').onclick = () => { location.hash = '#/i/' + i.id + '/' + (S.sec || ''); };
  $('#ttl').textContent = 'Report — ' + inspTitle(i); $('#sub').textContent = ''; $('#topActs').innerHTML = '';
  const urls = {}; for (const p of S.photos) urls[p.id] = URL.createObjectURL(p.rep);
  const opts = { blank: false, allFields: false, photos: true, log: true };
  const build = () => {
    const c = i.data.case || {}; const v = i.data.vehicle || {};
    let h = `<div class="rp-tools"><button class="btn sm" id="rpPrint">Print / Save PDF</button><label><input type="checkbox" id="oBlank" ${opts.blank ? 'checked' : ''}> Blank form (for handwriting)</label><label><input type="checkbox" id="oAll" ${opts.allFields ? 'checked' : ''}> Include empty fields</label><label><input type="checkbox" id="oPh" ${opts.photos ? 'checked' : ''}> Photos inline</label><label><input type="checkbox" id="oLog" ${opts.log ? 'checked' : ''}> Photo log</label></div><div class="rp ${opts.blank ? 'blankform' : ''}">`;
    h += `<div class="cover"><h1>Vehicle Inspection Notes</h1><div class="k"><b>Case</b><span>${esc(c.case)}</span><b>Date</b><span>${esc(fmtDate(c.vi_date))}</span><b>Vehicle</b><span>${esc([v.year, v.make, v.model, v.trim].filter(Boolean).join(' '))}</span><b>VIN</b><span>${esc(v.vin)}</span><b>Location</b><span>${esc(c.vi_loc)}</span><b>Engineers</b><span>${esc(c.vi_eng)}</span><b>Client</b><span>${esc(c.client)}</span><b>File No.</b><span>${esc(c.fileno)}</span></div></div>`;
    let first = true;
    for (const sid of i.enabled) {
      const s = secById(sid); const d = i.data[sid] || {};
      let body = ''; let grpHtml = ''; let grpBody = ''; let grpNa = false; let open = false;
      const closeGrp = () => { if (open) grpBody += '</div>'; open = false; if (grpHtml && (grpBody.trim() || grpNa || opts.allFields || opts.blank)) body += grpHtml + grpBody; else body += grpBody; grpHtml = ''; grpBody = ''; };
      for (const f of s.fields) {
        if (f.type === 'heading') {

          const ps = opts.photos ? photosFor(sid, f.id) : [];
          grpHtml = `<h3>${esc(f.label)}${grpNa ? '<span class="na">NOT APPLICABLE / NOT EVALUATED</span>' : ''}</h3>`; grpBody = photosHtml(ps, urls);
          continue;
        }
        if (grpNa && !opts.blank) continue;
        const vh = valHtml(f, d[f.id], opts.blank); const ps = opts.photos && !opts.blank ? photosFor(sid, f.id) : [];
        if (!vh && !opts.allFields && !ps.length) continue;
        if (!open) { grpBody += '<div class="kv">'; open = true; }
        const wide = f.full || ['area', 'table', 'lr', 'lrsel', 'multi'].includes(f.type) || ps.length;
        grpBody += `<div class="it ${wide ? 'full' : ''}"><div class="k">${esc(f.label)}</div>${vh || '<div class="v"></div>'}</div>`;
        if (ps.length) { grpBody += `<div class="it full">${photosHtml(ps, urls)}</div>`; }
      }
      closeGrp();
      if (!body.trim() && !opts.allFields && !opts.blank) continue;
      h += `<h2 class="${first ? 'first' : ''}">${esc(s.title)}</h2>${body}`; first = false;
    }
    if (opts.log && S.photos.length && !opts.blank) {
      h += `<h2>Photo Log</h2><table class="log"><thead><tr><th>No.</th><th>Section / Item</th><th>Caption</th><th>Time</th></tr></thead><tbody>${S.photos.slice().sort((a, b) => a.num - b.num).map(p => `<tr><td>${p.num}</td><td>${esc(photoLabel(p))}</td><td>${esc(p.caption)}</td><td>${new Date(p.ts).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
    }
    h += `<div class="sig"><div>Engineer</div><div>Date</div></div><div class="foot">Generated ${new Date().toLocaleString()} · ${S.photos.length} photos · VI Notes</div></div>`;
    R.innerHTML = h;
    R.querySelector('#rpPrint').onclick = () => window.print();
    R.querySelector('#oBlank').onchange = e => { opts.blank = e.target.checked; build(); };
    R.querySelector('#oAll').onchange = e => { opts.allFields = e.target.checked; build(); };
    R.querySelector('#oPh').onchange = e => { opts.photos = e.target.checked; build(); };
    R.querySelector('#oLog').onchange = e => { opts.log = e.target.checked; build(); };
  };
  build(); window.scrollTo(0, 0);
}

/* ===================== export / import (zip) ===================== */
const CRC = (() => { const t = new Int32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return b => { let c = -1; for (let i = 0; i < b.length; i++) c = t[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; }; })();
function zipStore(entries) { // entries: [{name, data:Uint8Array}] -> Blob (stored, no compression)
  const parts = []; const cd = []; let off = 0; const enc = new TextEncoder();
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  for (const e of entries) {
    const nm = enc.encode(e.name); const crc = CRC(e.data); const sz = e.data.length;
    const lh = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...nm]);
    parts.push(lh, e.data);
    cd.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off), ...nm]));
    off += lh.length + sz;
  }
  const cdLen = cd.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(entries.length), ...u16(entries.length), ...u32(cdLen), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cd, end], { type: 'application/zip' });
}
async function unzip(buf) { // supports stored (0) and deflate (8, via DecompressionStream)
  const dv = new DataView(buf); const u8 = new Uint8Array(buf); const out = {}; const dec = new TextDecoder();
  let eocd = buf.byteLength - 22; while (eocd >= 0 && dv.getUint32(eocd, true) !== 0x06054b50) eocd--; if (eocd < 0) throw new Error('bad zip');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(lo + 26, true), lel = dv.getUint16(lo + 28, true); const start = lo + 30 + lnl + lel;
    let data = u8.slice(start, start + csz);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[name] = data; p += 46 + nl + el + cl;
  }
  return out;
}
async function exportZip() {
  const i = S.insp; toast('Packaging…');
  try {
    const meta = { app: 'vi-notes', version: 1, inspection: i, photos: S.photos.map(p => ({ id: p.id, num: p.num, sec: p.sec, field: p.field, ts: p.ts, caption: p.caption, file: `photos/P${String(p.num).padStart(3, '0')}.jpg`, origName: p.origName })) };
    const entries = [{ name: 'inspection.json', data: new TextEncoder().encode(JSON.stringify(meta, null, 1)) }];
    for (const p of S.photos) { const buf = p.origBuf || p.repBuf || dataUrlToBuf(p.thumb); entries.push({ name: `photos/P${String(p.num).padStart(3, '0')}.jpg`, data: new Uint8Array(buf) }); }
    const blob = zipStore(entries); const c = i.data.case || {};
    const name = ((c.case || 'inspection').replace(/[^\w\- ]+/g, '').trim() || 'inspection') + '_' + (c.vi_date || today()) + '.zip';
    const file = new File([blob], name, { type: 'application/zip' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { // iPad / phone: share sheet (Save to Files, AirDrop, Mail…)
      try { await navigator.share({ files: [file], title: name }); toast('Exported'); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Exported ' + name);
  } catch (e) { console.error(e); alert('Export failed: ' + (e.message || e)); }
}
$('#impInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    let meta, files = {};
    if (f.name.endsWith('.json')) meta = JSON.parse(await f.text()); else { files = await unzip(await f.arrayBuffer()); meta = JSON.parse(new TextDecoder().decode(files['inspection.json'])); }
    const insp = migrateInsp(meta.inspection); const exists = await DB.get('insp', insp.id);
    if (exists && !confirm('An inspection with this ID already exists. Replace it?')) return;
    if (exists) { for (const p of await DB.photosOf(insp.id)) await DB.del('photos', p.id); }
    await DB.put('insp', insp);
    for (const pm of meta.photos || []) { const data = files[pm.file]; if (!data) continue; const blob = new Blob([data], { type: 'image/jpeg' }); const im = await loadImg(blob); const p = { id: pm.id, inspId: insp.id, sec: pm.sec, field: pm.field, num: pm.num, ts: pm.ts, caption: pm.caption || '', thumb: scale(im, 320, .7), repBuf: await blobToBuf(await scale(im, 1600, .82, true)), origBuf: data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength), origType: 'image/jpeg', origName: pm.origName || '' }; await DB.put('photos', p); }
    S.insp = null; toast('Imported'); location.hash = '#/i/' + insp.id; route();
  } catch (err) { console.error(err); alert('Import failed: ' + err.message); }
};
